table: subscriptions
grain: One row per subscription_id
primary_key:
- subscription_id
foreign_keys:
- columns:
  - account_id
  references: accounts(account_id)
- columns:
  - contract_id
  references: contracts(contract_id)
- columns:
  - plan_id
  references: plans(plan_id)
columns:
- name: subscription_id
  type: string
  nullable: false
- name: account_id
  type: string
  nullable: true
- name: contract_id
  type: string
  nullable: true
- name: plan_id
  type: string
  nullable: true
- name: trial_start_date
  type: date
  nullable: true
- name: trial_end_date
  type: date
  nullable: true
- name: subscription_start_date
  type: date
  nullable: true
- name: current_status
  type: string
  nullable: true
- name: cancel_requested_date
  type: date
  nullable: true
- name: ended_date
  type: date
  nullable: true
- name: churn_type
  type: string
  nullable: true
- name: billing_frequency
  type: string
  nullable: true
- name: currency_code
  type: string
  nullable: true
