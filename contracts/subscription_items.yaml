table: subscription_items
grain: One row per subscription_item_id
primary_key:
- subscription_item_id
foreign_keys:
- columns:
  - subscription_id
  references: subscriptions(subscription_id)
columns:
- name: subscription_item_id
  type: string
  nullable: false
- name: subscription_id
  type: string
  nullable: true
- name: item_type
  type: string
  nullable: true
- name: plan_id
  type: string
  nullable: true
- name: add_on_id
  type: string
  nullable: true
- name: quantity
  type: integer
  nullable: true
- name: unit_price_local
  type: decimal
  nullable: true
- name: discount_pct
  type: decimal
  nullable: true
- name: effective_start
  type: date
  nullable: true
- name: effective_end
  type: date
  nullable: true
- name: mrr_local
  type: decimal
  nullable: true
- name: mrr_eur
  type: decimal
  nullable: true
