table: credit_notes
grain: One row per credit_note_id
primary_key:
- credit_note_id
foreign_keys:
- columns:
  - invoice_id
  references: invoices(invoice_id)
columns:
- name: credit_note_id
  type: string
  nullable: false
- name: invoice_id
  type: string
  nullable: true
- name: issued_date
  type: date
  nullable: true
- name: reason
  type: string
  nullable: true
- name: amount_local
  type: decimal
  nullable: true
- name: amount_eur
  type: decimal
  nullable: true
- name: credit_note_status
  type: string
  nullable: true
