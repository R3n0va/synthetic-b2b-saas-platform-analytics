table: dunning_events
grain: One row per dunning_event_id
primary_key:
- dunning_event_id
foreign_keys:
- columns:
  - invoice_id
  references: invoices(invoice_id)
columns:
- name: dunning_event_id
  type: string
  nullable: false
- name: invoice_id
  type: string
  nullable: true
- name: event_at
  type: timestamp
  nullable: true
- name: dunning_step
  type: integer
  nullable: true
- name: channel
  type: string
  nullable: true
- name: event_status
  type: string
  nullable: true
- name: recovered_after_event_flag
  type: boolean
  nullable: true
