name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check data_generator/src tests
      - run: pytest
      - run: saas-platform run-all --config config/profiles/smoke.yaml --scenario config/scenarios/baseline.yaml --data-output data/generated/ci --report-output reports/generated/ci
